services:
  postgres:
    image: postgres:16
    container_name: giftoryth-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giftoryth}
      POSTGRES_USER: ${POSTGRES_USER:-giftoryth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - giftoryth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giftoryth} -d ${POSTGRES_DB:-giftoryth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  basket-shop-app:
    build:
      context: .
      dockerfile: Dockerfile.next
    container_name: basket-shop-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.giftoryth.com}
      - PRIMARY_DOMAIN=${PRIMARY_DOMAIN:-www.giftoryth.com}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-giftoryth}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-giftoryth}
    networks:
      - app_net
    env_file:
      - .env

volumes:
  giftoryth_postgres_data:

networks:
  app_net:
    external: true
