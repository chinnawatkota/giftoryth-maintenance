services:
  basket-shop-app:
    build:
      context: .
      dockerfile: Dockerfile.next
    container_name: basket-shop-app
    restart: always
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.giftoryth.com}
      - PRIMARY_DOMAIN=${PRIMARY_DOMAIN:-www.giftoryth.com}
    networks:
      - app_net
    env_file:
      - .env

networks:
  app_net:
    external: true
