services:
  postgres:
    image: postgres:16
    container_name: giftoryth-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: giftoryth
      POSTGRES_USER: giftoryth
      POSTGRES_PASSWORD: giftoryth123
    volumes:
      - giftoryth_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: giftoryth-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: giftoryth
      MINIO_ROOT_PASSWORD: giftoryth123
    volumes:
      - giftoryth_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: giftoryth-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 giftoryth giftoryth123; do sleep 2; done;
      mc mb --ignore-existing local/giftoryth-public;
      mc anonymous set download local/giftoryth-public;
      "

volumes:
  giftoryth_postgres_data:
  giftoryth_minio_data:
