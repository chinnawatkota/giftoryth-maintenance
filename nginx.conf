worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hide nginx version
    server_tokens off;

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # Deny hidden files
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Favicon and robots
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt { access_log off; log_not_found off; }

        # Static assets caching
        location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|woff|woff2|ttf|ico|txt)$ {
            expires max;
            try_files $uri =404;
        }

        # Handle /basket-shop-ui path
        location /basket-shop-ui/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /basket-shop-ui/index.html;
            
            # Handle static assets
            location ~* ^/basket-shop-ui/(.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
                alias /usr/share/nginx/html/$1;
                expires max;
                add_header Cache-Control "public, immutable";
            }
        }

        # Handle exact /basket-shop-ui path (redirect to /basket-shop-ui/)
        location = /basket-shop-ui {
            return 301 /basket-shop-ui/;
        }

        # Handle root path (optional)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}