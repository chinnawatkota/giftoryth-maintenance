services:
  postgres-dev:
    image: postgres:16
    container_name: giftoryth-postgres-dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giftoryth_dev}
      POSTGRES_USER: ${POSTGRES_USER:-giftoryth_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.dev-vps}
    volumes:
      - giftoryth_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giftoryth_dev} -d ${POSTGRES_DB:-giftoryth_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - giftoryth_dev_net

  minio-dev:
    image: minio/minio:latest
    container_name: giftoryth-minio-dev
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-giftoryth_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env.dev-vps}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - giftoryth_dev_minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.giftoryth-dev-images.rule=Host(`images-dev.giftoryth.com`)"
      - "traefik.http.routers.giftoryth-dev-images.entrypoints=websecure"
      - "traefik.http.routers.giftoryth-dev-images.tls.certresolver=letsencrypt"
      - "traefik.http.services.giftoryth-dev-images.loadbalancer.server.port=9000"
    networks:
      - giftoryth_dev_net

  minio-dev-init:
    image: minio/mc:latest
    container_name: giftoryth-minio-dev-init
    depends_on:
      - minio-dev
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio-dev:9000 ${S3_ACCESS_KEY_ID:-giftoryth_dev} ${S3_SECRET_ACCESS_KEY}; do sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-giftoryth-dev-public};
      mc anonymous set download local/${S3_BUCKET:-giftoryth-dev-public};
      "
    networks:
      - giftoryth_dev_net

  basket-shop-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.next
    container_name: basket-shop-app-dev
    restart: always
    depends_on:
      postgres-dev:
        condition: service_healthy
      minio-dev-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    env_file:
      - path: .env.dev-vps
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://dev.giftoryth.com}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-dev.giftoryth.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.dev-vps}
      DATABASE_URL: postgresql://${POSTGRES_USER:-giftoryth_dev}:${POSTGRES_PASSWORD}@postgres-dev:5432/${POSTGRES_DB:-giftoryth_dev}
      S3_ENDPOINT: http://minio-dev:9000
      S3_BUCKET: ${S3_BUCKET:-giftoryth-dev-public}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-giftoryth_dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.giftoryth-dev.rule=Host(`dev.giftoryth.com`)"
      - "traefik.http.routers.giftoryth-dev.entrypoints=websecure"
      - "traefik.http.routers.giftoryth-dev.tls.certresolver=letsencrypt"
      - "traefik.http.services.giftoryth-dev.loadbalancer.server.port=8080"
    networks:
      - giftoryth_dev_net

volumes:
  giftoryth_dev_postgres_data:
    name: giftoryth_dev_postgres_data
  giftoryth_dev_minio_data:
    name: giftoryth_dev_minio_data

networks:
  giftoryth_dev_net:
    name: giftoryth_dev_net
