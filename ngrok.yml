    # basic_auth:
    #   - "username:password"
    # Optional: OAuth
    # oauth: "google"
    # Optional: IP restrictions
    # ip_restriction:
    #   - "0.0.0.0/0"
    # Optional: Request headers
    # request_header:
    #   add:
    #     - "X-Custom-Header: value"
    # Optional: Response headers
    # response_header:
    #   add:
    #     - "X-Custom-Response: value"
    # Optional: Circuit breaker
    # circuit_breaker:
    #   error_threshold: 5
    #   duration: 30s
    #   volume_threshold: 10
    # Optional: Compression
    # compression: true
    # Optional: Webhook verification
